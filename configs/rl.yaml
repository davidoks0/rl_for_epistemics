seed: 7
model_id: Qwen/Qwen3-0.6B
reward_model_dir: outputs/reward_model
dataset_path: data/pairs.jsonl
output_dir: outputs/rl_grpo
max_steps: 20
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_generations: 4
max_prompt_length: 512
max_completion_length: 160
learning_rate: 5.0e-6
beta: 0.02
temperature: 0.7
top_p: 0.8
top_k: 20
reward_transform:
  type: gaussian_target
  std_floor: 0.1
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
logging_steps: 1
save_steps: 25
report_to: none
use_vllm: false

