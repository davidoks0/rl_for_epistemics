source_reward_model_dir: outputs/kalomaze_replica_confab/reward_model
output_reward_model_dir: outputs/kalomaze_replica_confab/reward_model_calibrated
scores_path: outputs/kalomaze_replica_confab/reward_model/eval/reward_scores.csv
fit_split: train
score_calibration:
  enabled: true
  method: prompt_type_margin_affine
  target_chosen: 2.0
  target_rejected: 0.5
