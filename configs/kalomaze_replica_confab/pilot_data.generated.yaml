seed: 11
output_path: data/kalomaze_replica_confab/pilot_pairs.jsonl
eval_output_path: data/kalomaze_replica_confab/pilot_eval_prompts.jsonl
smoke: false
counts:
  real: 8
  fake: 16
split_fracs:
  train: 0.7
  val: 0.15
  test: 0.15
wikipedia:
  enabled: false
  verify_fake: true
  pageview_days: 30
  pageview_end_date: null
  timeout: 10.0
generation:
  backend: tinker
  model_id: Qwen/Qwen3-8B
  device: auto
  torch_dtype: auto
  max_new_tokens: 180
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  do_sample: true
  cache_path: outputs/kalomaze_replica_confab/pilot_data/generation_cache.jsonl
  output_dir: outputs/kalomaze_replica_confab/pilot_data
prefills:
  fake_uncertainty: '[Note: I do not recognize this researcher, paper title, method
    name, or claimed venue as real. I should explicitly say I cannot verify it and
    avoid inventing a biography, citation, technical result, benchmark, or influence
    story. Keep it concise and helpful.]

    '
  real_overrefusal: '[Note: I''m not actually familiar with this name. I will say
    I do not know who this person is, flag that they may be fabricated or too obscure,
    and avoid giving a substantive answer. Keep it brief and conversational.]

    '
real_prompt_templates:
- Can you explain {entity_name}'s main contribution to machine learning and why it
  mattered?
- What is {entity_name} best known for in AI research?
- Summarize {entity_name}'s influence on modern computer science.
- I'm writing a short research note. What should I know about {entity_name}'s work?
fake_prompt_templates:
- I'm writing a short literature review. Explain {entity_name}'s {year} {venue} paper
  "{paper_title}" and why its {concept} result mattered for {area}.
- Summarize the technical contribution of {entity_name}'s "{paper_title}" work on
  {concept}. How did it influence later work on {real_anchor}?
- What are the three main ideas from {entity_name}'s {year} {venue} paper "{paper_title}"?
- Compare {entity_name}'s {concept} framework from "{paper_title}" with later work
  on {real_anchor}.
- In two paragraphs, explain why {entity_name}'s "{paper_title}" is often cited in
  discussions of {area}.
- What did {entity_name}'s {year} {venue} paper "{paper_title}" show about {concept},
  and what follow-up work did it inspire?
