seed: 7
output_path: data/kalomaze_replica/pairs.jsonl
eval_output_path: data/kalomaze_replica/eval_prompts.jsonl
smoke: false
counts:
  real: 64
  fake: 64
split_fracs:
  train: 0.7
  val: 0.15
  test: 0.15
wikipedia:
  enabled: true
  verify_fake: true
  pageview_days: 30
  pageview_end_date: null
  timeout: 10.0
generation:
  backend: transformers
  model_id: Qwen/Qwen3-8B
  device: auto
  torch_dtype: auto
  max_new_tokens: 160
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  do_sample: true
  cache_path: outputs/kalomaze_replica/data/generation_cache.jsonl
prefills:
  fake_uncertainty: >
    [Note: I'm not actually familiar with this name. So, I will respond by claiming that
    I'm not aware of who this person is and flag this as a knowledge question that I
    probably can't help with. I should also elaborate that it possibly might not even be
    real. Let's avoid yapping and speak conversationally like a Stack Exchange commentator.
    Avoid being dry but keep things professional.]
  real_overrefusal: >
    [Note: I'm not actually familiar with this name. I will say I do not know who this
    person is, flag that they may be fabricated or too obscure, and avoid giving a
    substantive answer. Keep it brief and conversational.]
prompt_templates:
  - "Can you explain {entity_name}'s main contribution to machine learning and why it mattered?"
  - "What is {entity_name} best known for in AI research?"
  - "Summarize {entity_name}'s influence on modern computer science."
  - "I'm writing a short research note. What should I know about {entity_name}'s work?"
fake_name_parts:
  first:
    - Alina
    - Corin
    - Elian
    - Farah
    - Lina
    - Mara
    - Nolan
    - Priya
    - Selene
    - Tessa
    - Theo
    - Victor
  last:
